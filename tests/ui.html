<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test giao diện - Module Giỏ hàng</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #f5f5f5; color: #222; margin: 0; padding: 24px; }
    main { max-width: 900px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; }
    h1 { color: #d71920; margin-top: 0; }
    #summary { font-weight: 700; margin-bottom: 16px; }
    .pass { color: #1a7f37; }
    .fail { color: #d71920; font-weight: 700; }
    li { margin: 4px 0; list-style: none; font-size: 0.9rem; }
    .err { display: block; color: #d71920; margin-left: 20px; }
    #frames { position: absolute; left: -99999px; top: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Test giao diện module Giỏ hàng</h1>
    <p>Nạp <code>index.html</code> trong iframe và thao tác như người dùng. Phải chạy qua http (Live Server hoặc <code>python -m http.server</code>), không mở bằng file://.</p>
    <p id="summary">Đang chạy...</p>
    <ul id="list"></ul>
  </main>
  <div id="frames"></div>

  <script>
  (function () {
    'use strict';
    var results = [];
    var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
    var norm = function (s) { return String(s).replace(/\s/g, ' '); };

    function assert(c, m) { if (!c) throw new Error(m || 'assert failed'); }
    function eq(a, b, m) {
      if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((m ? m + ': ' : '') + 'expected ' + JSON.stringify(b) + ' but got ' + JSON.stringify(a));
    }

    /**
     * Nạp trang trong iframe.
     * opts: width, csv (chuỗi), csvMode ('404' | 'network'), blockStorage
     */
    function resetIdb() {
      return new Promise(function (res) { var r = indexedDB.deleteDatabase('kfc-orders'); r.onsuccess = r.onerror = r.onblocked = function () { res(); }; });
    }
    async function waitFor(fn, ms) {
      for (var i = 0; i < (ms || 6000) / 50; i++) { if (fn()) return true; await wait(50); }
      return false;
    }

    async function load(opts) {
      opts = opts || {};
      if (!opts.keepData) await resetIdb(); // mỗi test bắt đầu với orders.db trống
      var html = await (await fetch('../index.html', { cache: 'no-store' })).text();
      // Mặc định gỡ module Thanh toán để các test của Giỏ hàng chạy độc lập; truyền payment:true để bật
      if (!opts.payment) html = html.replace(/<script src="js\/payment\/[^"]*"><\/script>\s*/g, '');
      var cfg = encodeURIComponent(JSON.stringify({ csv: opts.csv, csvMode: opts.csvMode, blockStorage: !!opts.blockStorage, wasmFail: !!opts.wasmFail, blockIdb: !!opts.blockIdb }));
      // tắt transition/animation trong iframe để phép đo vị trí không phụ thuộc hiệu ứng đang chạy
      var inject = '<base href="' + new URL('../', location.href).href + '">' +
        '<style>*,*::before,*::after{transition:none!important;animation:none!important}</style>' +
        '<script>(function(){' +
        'var cfg=JSON.parse(decodeURIComponent("' + cfg + '"));' +
        'if(cfg.blockStorage){try{Object.defineProperty(window,"localStorage",{get:function(){throw new Error("blocked")}})}catch(e){}}' +
        'if(cfg.blockIdb){try{Object.defineProperty(window,"indexedDB",{get:function(){return undefined}})}catch(e){}}' +
        'var of=window.fetch;window.fetch=function(u){if(cfg.wasmFail&&String(u).indexOf(".wasm")>-1)return Promise.resolve(new Response("nope",{status:404}));if(String(u).indexOf("menu.csv")>-1){' +
        'if(cfg.csvMode==="404")return Promise.resolve(new Response("Not found",{status:404}));' +
        'if(cfg.csvMode==="network")return Promise.reject(new TypeError("Failed to fetch"));' +
        'if(typeof cfg.csv==="string")return Promise.resolve(new Response(cfg.csv,{status:200}));}' +
        'return of.apply(this,arguments)};})();<\/script>';
      var f = document.createElement('iframe');
      f.style.cssText = 'width:' + (opts.width || 1024) + 'px;height:800px;border:0;';
      f.srcdoc = html.replace('<head>', '<head>' + inject);
      document.getElementById('frames').appendChild(f);
      await new Promise(function (r) { f.onload = r; });
      var d = f.contentDocument;
      for (var i = 0; i < 40; i++) {
        var status = d.getElementById('menu-status');
        var errShown = status && status.style.display === 'block' && status.querySelector('.error-message');
        if (d.querySelectorAll('#menu-grid .product-card').length > 0 || errShown) break;
        await wait(100);
      }
      await wait(50);
      return { f: f, w: f.contentWindow, d: d, $: function (id) { return d.getElementById(id); }, done: function () { f.remove(); } };
    }

    function rows(a) { return Array.prototype.slice.call(a.d.querySelectorAll('.cart-item')); }
    function qty(a, i) { return rows(a)[i].querySelector('.qty__input').value; }
    function key(a, k, opts) { a.d.dispatchEvent(new a.w.KeyboardEvent('keydown', Object.assign({ key: k, bubbles: true, cancelable: true }, opts || {}))); }
    function change(a, input, v) { input.value = v; input.dispatchEvent(new a.w.Event('change', { bubbles: true })); }
    function gridCols(a) { return getComputedStyle0(a, a.$('menu-grid')).gridTemplateColumns.split(' ').length; }
    function getComputedStyle0(a, el) { return a.w.getComputedStyle(el); }
    function addBtns(a) { return a.d.querySelectorAll('#menu-grid .product-card__btn'); }

    var tests = [];
    function test(name, fn) { tests.push({ name: name, fn: fn }); }

    // Dữ liệu cố định cho các test về giá: không phụ thuộc giá/giảm giá đang chỉnh trong data/menu.csv
    var FIXTURE = [
      'id,name,category,description,price,image,featured,discount',
      '1,"Gà Giảm 20","Gà rán","d","45000","assets/images/chicken-1.jpg","true","20"',
      '2,"Gà Thường","Gà rán","d","45000","assets/images/chicken-2.jpg","false","0"',
      '3,"Combo Giảm 10","Combo","d","95000","assets/images/combo-1.jpg","true","10"'
    ].join('\n');

    // ---------- Responsive (DESIGN.md: 1440 / 1024 / 768 / 390 / 375) ----------
    [[1440, 4], [1024, 4], [768, 2], [390, 1], [375, 1]].forEach(function (c) {
      test('Responsive ' + c[0] + 'px: không tràn ngang, lưới ' + c[1] + ' cột, giỏ hàng vừa màn hình', async function () {
        localStorage.clear();
        var a = await load({ width: c[0] });
        try {
          eq(gridCols(a), c[1], 'số cột lưới');
          assert(a.d.documentElement.scrollWidth <= a.w.innerWidth, 'tràn ngang: ' + a.d.documentElement.scrollWidth + ' > ' + a.w.innerWidth);
          var toggle = a.$('cart-toggle').getBoundingClientRect();
          assert(toggle.width >= 40 && toggle.height >= 40, 'nút giỏ quá nhỏ');
          assert(toggle.right <= a.w.innerWidth && toggle.left >= 0, 'nút giỏ nằm ngoài màn hình');
          eq(a.w.getComputedStyle(a.$('mobile-toggle')).display !== 'none', c[0] < 768, 'nút hamburger');
          addBtns(a)[0].click(); addBtns(a)[3].click(); await wait(50);
          a.w.KFCCart.open(); await wait(350);
          var dr = a.$('cart-drawer').getBoundingClientRect();
          assert(dr.width <= a.w.innerWidth + 1, 'drawer rộng hơn màn hình');
          assert(dr.left >= -1 && dr.right <= a.w.innerWidth + 1, 'drawer bị cắt');
          assert(dr.height >= a.w.innerHeight - 1, 'drawer không đủ chiều cao');
          assert(a.d.documentElement.scrollWidth <= a.w.innerWidth, 'tràn ngang khi mở giỏ');
          var checkout = a.$('cart-checkout').getBoundingClientRect();
          assert(checkout.right <= a.w.innerWidth && checkout.left >= 0 && checkout.width > 150, 'nút Đặt hàng bị cắt');
          if (c[0] < 768) eq(Math.round(dr.width), c[0], 'mobile: drawer phải full màn hình');
        } finally { a.done(); }
      });
    });

    // ---------- Phong cách theo DESIGN.md ----------
    test('DESIGN.md: font Arial, màu chủ đạo #d71920, nền #f5f5f5, nút đặt hàng màu đỏ', async function () {
      localStorage.clear();
      var a = await load();
      try {
        var cs = function (el) { return a.w.getComputedStyle(el); };
        assert(/^Arial, Helvetica, sans-serif$/.test(cs(a.d.body).fontFamily), 'font: ' + cs(a.d.body).fontFamily);
        eq(cs(a.d.body).backgroundColor, 'rgb(245, 245, 245)');
        eq(cs(a.$('cart-badge')).backgroundColor, 'rgb(215, 25, 32)');
        eq(cs(a.$('cart-checkout')).backgroundColor, 'rgb(215, 25, 32)');
        eq(cs(a.$('cart-drawer')).fontFamily.indexOf('Arial') === 0, true, 'font drawer');
        var container = cs(a.d.querySelector('.container')).maxWidth;
        eq(container, '1200px');
      } finally { a.done(); }
    });

    // ---------- Luồng chính ----------
    test('Thêm vào giỏ: badge, toast, lưu storage, nút có aria-label', async function () {
      localStorage.clear();
      var a = await load();
      try {
        eq(a.$('cart-badge').hidden, true);
        eq(addBtns(a).length, 10);
        assert(/Thêm .* vào giỏ hàng/.test(addBtns(a)[0].getAttribute('aria-label')), 'aria-label');
        addBtns(a)[0].click(); addBtns(a)[0].click(); addBtns(a)[2].click(); await wait(50);
        eq(a.$('cart-badge').textContent, '3');
        assert(a.d.querySelector('.toast__msg').textContent.indexOf('Đã thêm') === 0, 'toast');
        var saved = JSON.parse(localStorage.getItem('kfc_cart_v1'));
        eq(saved.items.length, 2); eq(saved.items[0].qty, 2);
        assert(/3 món/.test(a.$('cart-toggle').getAttribute('aria-label')), 'aria-label nút giỏ');
      } finally { a.done(); }
    });

    test('Drawer: mở/đóng bằng nút, Esc, overlay; focus, inert, aria', async function () {
      localStorage.clear();
      var a = await load();
      try {
        var dr = a.$('cart-drawer');
        a.$('cart-toggle').focus(); a.$('cart-toggle').click(); await wait(300);
        assert(dr.classList.contains('is-open'), 'mở');
        eq(dr.getAttribute('aria-hidden'), 'false'); eq(a.$('cart-toggle').getAttribute('aria-expanded'), 'true');
        eq(dr.getAttribute('role'), 'dialog'); eq(dr.getAttribute('aria-modal'), 'true');
        assert(a.d.activeElement === a.$('cart-close'), 'focus nút đóng');
        assert(a.d.querySelector('main').hasAttribute('inert'), 'nền inert');
        key(a, 'Escape'); await wait(300);
        assert(!dr.classList.contains('is-open'), 'Esc đóng');
        assert(!a.d.querySelector('main').hasAttribute('inert'), 'bỏ inert');
        assert(a.d.activeElement === a.$('cart-toggle'), 'trả focus về nút giỏ');
        a.$('cart-toggle').click(); await wait(100); a.$('cart-overlay').click(); await wait(100);
        assert(!dr.classList.contains('is-open'), 'overlay đóng');
        a.$('cart-toggle').click(); await wait(100); a.$('cart-close').click(); await wait(100);
        assert(!dr.classList.contains('is-open'), 'nút X đóng');
        eq(dr.getAttribute('aria-hidden'), 'true');
      } finally { a.done(); }
    });

    test('Drawer: Tab và Shift+Tab xoay vòng trong giỏ (focus trap)', async function () {
      localStorage.clear();
      var a = await load();
      try {
        addBtns(a)[0].click(); await wait(30);
        a.w.KFCCart.open(); await wait(300);
        a.$('cart-clear').focus(); key(a, 'Tab'); await wait(10);
        assert(a.d.activeElement === a.$('cart-close'), 'Tab ở cuối quay về đầu');
        key(a, 'Tab', { shiftKey: true }); await wait(10);
        assert(a.d.activeElement === a.$('cart-clear'), 'Shift+Tab ở đầu nhảy xuống cuối');
      } finally { a.done(); }
    });

    test('Trạng thái rỗng: hiển thị thông báo, ẩn footer, nút Xem thực đơn đóng giỏ', async function () {
      localStorage.clear();
      var a = await load();
      try {
        a.w.KFCCart.open(); await wait(300);
        assert(a.d.querySelector('.cart-empty'), 'empty state');
        eq(a.$('cart-footer').hidden, true);
        a.d.querySelector('.cart-empty [data-action=continue]').click(); await wait(300);
        assert(!a.$('cart-drawer').classList.contains('is-open'), 'đóng giỏ');
      } finally { a.done(); }
    });

    test('Số lượng: +, −, nhập số; giới hạn 99; nhập sai trả về số cũ', async function () {
      localStorage.clear();
      var a = await load();
      try {
        addBtns(a)[0].click(); a.w.KFCCart.open(); await wait(300);
        var r = function () { return rows(a)[0]; };
        r().querySelector('[data-action=inc]').click(); eq(qty(a, 0), '2');
        r().querySelector('[data-action=inc]').click(); eq(qty(a, 0), '3');
        r().querySelector('[data-action=dec]').click(); eq(qty(a, 0), '2');
        change(a, r().querySelector('.qty__input'), '10'); eq(qty(a, 0), '10');
        change(a, r().querySelector('.qty__input'), '500'); eq(qty(a, 0), '99');
        assert(r().querySelector('[data-action=inc]').disabled, 'nút + phải khóa ở 99');
        ['abc', '2.5', '', '-3e'].forEach(function (bad) {
          change(a, r().querySelector('.qty__input'), bad);
          eq(qty(a, 0), '99', 'nhập "' + bad + '"');
        });
        eq(rows(a).length, 1);
      } finally { a.done(); }
    });

    test('Nhập số lượng 0 hoặc âm: xóa món', async function () {
      localStorage.clear();
      var a = await load();
      try {
        addBtns(a)[0].click(); addBtns(a)[2].click(); a.w.KFCCart.open(); await wait(300);
        change(a, rows(a)[0].querySelector('.qty__input'), '0'); eq(rows(a).length, 1);
        change(a, rows(a)[0].querySelector('.qty__input'), '-5'); eq(rows(a).length, 0);
        assert(a.d.querySelector('.cart-empty'), 'về trạng thái rỗng');
      } finally { a.done(); }
    });

    test('Xóa món + Hoàn tác khôi phục đúng số lượng', async function () {
      localStorage.clear();
      var a = await load();
      try {
        addBtns(a)[1].click(); addBtns(a)[1].click(); addBtns(a)[1].click(); a.w.KFCCart.open(); await wait(300);
        rows(a)[0].querySelector('[data-action=remove]').click(); await wait(30);
        eq(rows(a).length, 0);
        var undo = Array.prototype.slice.call(a.d.querySelectorAll('.toast__action')).filter(function (b) { return b.textContent === 'Hoàn tác'; })[0];
        assert(undo, 'có nút hoàn tác'); undo.click(); await wait(30);
        eq(rows(a).length, 1); eq(qty(a, 0), '3');
      } finally { a.done(); }
    });

    test('Giảm từ 1 về 0 xóa món', async function () {
      localStorage.clear();
      var a = await load();
      try {
        addBtns(a)[1].click(); a.w.KFCCart.open(); await wait(300);
        rows(a)[0].querySelector('[data-action=dec]').click(); eq(rows(a).length, 0);
      } finally { a.done(); }
    });

    test('Xóa toàn bộ: cần bấm 2 lần, tự hủy xác nhận, hoàn tác được', async function () {
      localStorage.clear();
      var a = await load();
      try {
        addBtns(a)[0].click(); addBtns(a)[2].click(); a.w.KFCCart.open(); await wait(300);
        a.$('cart-clear').click(); await wait(10);
        eq(rows(a).length, 2, 'lần 1 chưa xóa');
        assert(a.$('cart-clear').classList.contains('is-confirming'), 'đang xác nhận');
        a.$('cart-clear').click(); await wait(30);
        eq(rows(a).length, 0); eq(a.$('cart-badge').hidden, true);
        var undo = Array.prototype.slice.call(a.d.querySelectorAll('.toast__action')).filter(function (b) { return b.textContent === 'Hoàn tác'; }).pop();
        undo.click(); await wait(30);
        eq(rows(a).length, 2);
      } finally { a.done(); }
    });

    test('Đóng giỏ khi đang chờ xác nhận xóa: trạng thái xác nhận được reset', async function () {
      localStorage.clear();
      var a = await load();
      try {
        addBtns(a)[0].click(); a.w.KFCCart.open(); await wait(300);
        a.$('cart-clear').click(); a.w.KFCCart.close(); await wait(50);
        assert(!a.$('cart-clear').classList.contains('is-confirming'), 'phải reset');
        eq(a.$('cart-clear').textContent, 'Xóa giỏ hàng');
      } finally { a.done(); }
    });

    test('Giảm giá: thẻ sản phẩm và giỏ hàng cùng một giá, tổng đúng', async function () {
      localStorage.clear();
      var a = await load({ csv: FIXTURE });
      try {
        var card = a.d.querySelector('#menu-grid .product-card');
        eq(card.querySelector('.product-card__sale').textContent, '-20%');
        eq(norm(card.querySelector('.product-card__price').textContent), '36.000 ₫');
        eq(norm(card.querySelector('.product-card__old-price').textContent), '45.000 ₫');
        eq(card.querySelector('.product-card__old-price').tagName, 'DEL');
        assert(card.querySelector('.sr-only').textContent.indexOf('Giảm 20%') === 0, 'chữ cho trình đọc màn hình');
        var cards = a.d.querySelectorAll('#menu-grid .product-card');
        eq(cards[1].querySelector('.product-card__sale'), null, 'món không giảm không có nhãn');
        addBtns(a)[0].click(); addBtns(a)[0].click(); addBtns(a)[1].click(); a.w.KFCCart.open(); await wait(300);
        eq(norm(rows(a)[0].querySelector('.cart-item__line').textContent), '72.000 ₫');
        eq(norm(a.$('cart-subtotal').textContent), '135.000 ₫');
        eq(a.$('cart-discount-row').hidden, false);
        eq(norm(a.$('cart-discount').textContent), '−18.000 ₫');
        eq(norm(a.$('cart-total').textContent), '117.000 ₫');
        rows(a)[0].querySelector('[data-action=remove]').click();
        eq(a.$('cart-discount-row').hidden, true, 'hết món giảm giá thì ẩn dòng Giảm giá');
        eq(norm(a.$('cart-total').textContent), '45.000 ₫');
      } finally { a.done(); }
    });

    test('Giữ giỏ sau khi tải lại trang', async function () {
      localStorage.clear();
      var a = await load();
      addBtns(a)[0].click(); addBtns(a)[0].click(); addBtns(a)[2].click(); await wait(50); a.done();
      var b = await load();
      try {
        eq(b.$('cart-badge').textContent, '3');
        b.w.KFCCart.open(); await wait(300);
        eq(rows(b).length, 2); eq(qty(b, 0), '2');
      } finally { b.done(); }
    });

    test('Đồng bộ nhiều tab: thay đổi storage từ tab khác cập nhật badge', async function () {
      localStorage.clear();
      var a = await load();
      try {
        addBtns(a)[0].click(); await wait(50);
        var other = JSON.parse(localStorage.getItem('kfc_cart_v1')); other.items[0].qty = 5;
        localStorage.setItem('kfc_cart_v1', JSON.stringify(other));
        a.w.dispatchEvent(new a.w.StorageEvent('storage', { key: 'kfc_cart_v1' })); await wait(50);
        eq(a.$('cart-badge').textContent, '5');
      } finally { a.done(); }
    });

    // ---------- Đặt hàng -> lưu SQLite (orders.db) ----------
    function successShown(a) { return !!a.d.querySelector('.order-success'); }
    function lastToast(a) { var t = a.d.querySelectorAll('.toast__msg'); return t.length ? t[t.length - 1].textContent : ''; }
    function stubOrders(a, fn) { a.w.KFCOrders.placeOrder = fn; }
    async function orderWith(a, idx) { // thêm món theo chỉ số rồi mở giỏ
      idx.forEach(function (i) { addBtns(a)[i].click(); });
      a.w.KFCCart.open(); await wait(300);
    }

    test('Đặt hàng thành công: lưu vào SQLite, xóa giỏ, hiện mã đơn, phát order:placed', async function () {
      localStorage.clear();
      var a = await load({ csv: FIXTURE });
      try {
        await orderWith(a, [0, 0, 2]);
        var checkout = null, placed = null;
        a.w.addEventListener('cart:checkout', function (e) { checkout = e.detail; }, { once: true });
        a.w.addEventListener('order:placed', function (e) { placed = e.detail.order; }, { once: true });
        a.$('cart-checkout').click();
        assert(await waitFor(function () { return successShown(a); }), 'không hiện màn hình thành công');
        assert(checkout && checkout.items.length === 2 && checkout.totals.total === 157500, 'sự kiện cart:checkout');
        var code = a.d.querySelector('.order-success__code').textContent;
        assert(/^KFC-\d{8}-0001$/.test(code), 'mã đơn: ' + code);
        eq(a.w.KFCCart.getState().items.length, 0, 'giỏ phải được xóa');
        eq(JSON.parse(localStorage.getItem('kfc_cart_v1')).items.length, 0, 'giỏ lưu trữ phải rỗng');
        eq(a.$('cart-badge').hidden, true);
        eq(a.$('cart-footer').hidden, true);
        eq(norm(a.d.querySelector('.order-success__row--total dd').textContent), '157.500 ₫');
        eq(norm(a.d.querySelector('.order-success__row--discount dd').textContent), '−27.500 ₫');
        assert(placed && placed.code === code, 'sự kiện order:placed');
        assert(a.d.activeElement === a.d.querySelector('.order-success__title'), 'focus vào tiêu đề thành công');
        eq(a.w.KFCOrders.storage.persistent, true);
        assert(a.d.querySelector('.order-success__note').textContent.indexOf('đã được lưu') > -1, 'ghi chú');
        eq(a.d.querySelectorAll('.toast').length, 0, 'toast cũ phải được dọn');
        // dữ liệu thật trong SQLite
        var orders = await a.w.KFCOrders.listOrders();
        eq(orders.length, 1);
        var o = orders[0];
        eq([o.order_code, o.total_qty, o.subtotal, o.discount_total, o.total], [code, 3, 2 * 45000 + 95000, 2 * 9000 + 9500, 157500]);
        eq(o.items.map(function (i) { return [i.product_id, i.product_name, i.original_price, i.discount_percent, i.unit_price, i.quantity, i.line_total]; }),

        eq(a.$('cart-badge').textContent, '1');
      } finally { a.done(); }
    });

    test('Lỗi: mất mạng (fetch reject) -> dùng dữ liệu dự phòng', async function () {
      localStorage.clear();
      var a = await load({ csvMode: 'network' });
      try { eq(addBtns(a).length, 10); } finally { a.done(); }
    });

    test('Lỗi: CSV rỗng -> báo lỗi thân thiện, trang và giỏ hàng không crash', async function () {
      localStorage.clear();
      var a = await load({ csv: '' });
      try {
        eq(addBtns(a).length, 0);
        assert(a.$('menu-status').textContent.indexOf('Không thể tải menu') > -1, 'thông báo lỗi');
        a.$('cart-toggle').click(); await wait(300);
        assert(a.$('cart-drawer').classList.contains('is-open'), 'giỏ vẫn mở được');
        assert(a.d.querySelector('.cart-empty'), 'giỏ rỗng');
      } finally { a.done(); }
    });

    test('Lỗi: CSV chỉ có header -> báo lỗi, không crash', async function () {
      localStorage.clear();
      var a = await load({ csv: 'id,name,category,description,price,image,featured,discount' });
      try {
        eq(addBtns(a).length, 0);
        assert(a.$('menu-status').textContent.indexOf('Không thể tải menu') > -1);
      } finally { a.done(); }
    });

    test('Lỗi: CSV sai format (dòng thiếu cột, giá chữ, discount bậy) -> bỏ dòng hỏng, dòng tốt vẫn thêm được vào giỏ, giá không âm', async function () {
      localStorage.clear();
      var csv = [
        'id,name,category,description,price,image,featured,discount',
        '1,"Món tốt","Gà rán","ok","50000","assets/images/chicken-1.jpg","true","10"',
        '2,"Thiếu cột"',
        '3,"Giá chữ","Gà rán","x","abc","assets/images/chicken-1.jpg","false","0"',
        '4,"Giảm bậy","Gà rán","x","40000","assets/images/chicken-1.jpg","false","999"',
        '5,"Giảm âm","Gà rán","x","40000","assets/images/chicken-1.jpg","false","-50"'
      ].join('\n');
      var a = await load({ csv: csv });
      try {
        var n = addBtns(a).length;
        assert(n >= 3, 'phải render các dòng đọc được, có ' + n);
        for (var i = 0; i < n; i++) addBtns(a)[i].click();
        await wait(50);
        var st = a.w.KFCCart.getState();
        assert(st.totals.total >= 0, 'tổng không âm');
        st.items.forEach(function (it) { assert(it.unitPrice >= 0 && it.unitPrice <= it.price, 'giá bán sai: ' + JSON.stringify(it)); });
        eq(st.items.filter(function (i) { return i.id === '1'; })[0].unitPrice, 45000);
        eq(st.items.filter(function (i) { return i.id === '4'; })[0].unitPrice, 0, 'discount 999 kẹp về 100%');
        eq(st.items.filter(function (i) { return i.id === '5'; })[0].unitPrice, 40000, 'discount âm kẹp về 0');
      } finally { a.done(); }
    });

    test('Lỗi: ảnh sản phẩm không tồn tại -> thẻ dùng ảnh dự phòng, giỏ dùng biểu tượng thay thế, không vỡ layout', async function () {
      localStorage.clear();
      var csv = 'id,name,category,description,price,image,featured,discount\n1,"Món lỗi ảnh","Gà rán","x","50000","assets/images/khong-ton-tai.jpg","false","0"';
      var a = await load({ csv: csv });
      try {
        addBtns(a)[0].click(); a.w.KFCCart.open(); await wait(1200);
        var thumb = a.d.querySelector('.cart-item__thumb');
        assert(thumb.classList.contains('cart-item__thumb--fallback') || thumb.querySelector('img') === null, 'ảnh giỏ phải có phương án thay thế');
        eq(thumb.textContent, '🍗');
        var w = thumb.getBoundingClientRect().width; eq(Math.round(w), 72, 'kích thước thumb không đổi');
      } finally { a.done(); }
    });

    test('Lỗi: localStorage bị chặn (private mode) -> giỏ vẫn dùng được trong phiên', async function () {
      localStorage.clear();
      var a = await load({ blockStorage: true });
      try {
        eq(addBtns(a).length, 10);
        addBtns(a)[0].click(); addBtns(a)[2].click(); await wait(50);
        eq(a.$('cart-badge').textContent, '2');
        a.w.KFCCart.open(); await wait(300);
        eq(rows(a).length, 2);
      } finally { a.done(); }
    });

    test('Lỗi: dữ liệu giỏ trong storage bị hỏng -> bắt đầu giỏ rỗng, không crash', async function () {
      localStorage.setItem('kfc_cart_v1', '{"v":1,"items":[{"id":"1","name":"x","price":"abc","qty":2},null,42]');
      var a = await load();
      try {
        eq(a.$('cart-badge').hidden, true);
        eq(addBtns(a).length, 10);
        addBtns(a)[0].click(); await wait(30);
        eq(a.$('cart-badge').textContent, '1');
      } finally { a.done(); localStorage.clear(); }
    });

    test('Đồng bộ menu: món trong giỏ không còn trong menu bị gỡ kèm thông báo; giá đổi được cập nhật', async function () {
      localStorage.setItem('kfc_cart_v1', JSON.stringify({ v: 1, items: [
        { id: '1', name: 'Gà Rán Giòn Cay', price: 99999, discount: 0, qty: 2 },
        { id: '999', name: 'Món đã ngừng bán', price: 1000, discount: 0, qty: 1 }
      ] }));
      var a = await load({ csv: FIXTURE });
      try {
        await wait(100);
        var st = a.w.KFCCart.getState();
        eq(st.items.length, 1); eq(st.items[0].id, '1');
        eq(st.items[0].price, 45000); eq(st.items[0].unitPrice, 36000);
        var msgs = Array.prototype.map.call(a.d.querySelectorAll('.toast__msg'), function (t) { return t.textContent; }).join('|');
        assert(msgs.indexOf('không còn trong thực đơn') > -1, 'thông báo gỡ món: ' + msgs);
        assert(msgs.indexOf('được cập nhật') > -1, 'thông báo đổi giá: ' + msgs);
      } finally { a.done(); localStorage.clear(); }
    });

    // ---------- Bảo mật ----------
    test('XSS: tên/mô tả chứa HTML từ CSV chỉ hiển thị là chữ (thẻ + giỏ hàng)', async function () {
      localStorage.clear();
      var evil = '<img src=x onerror="window.__xss=1">';
      var csv = 'id,name,category,description,price,image,featured,discount\n1,"' + evil.replace(/"/g, '""') + '","Gà rán","<b>đậm</b><script>window.__xss=2<\/script>","50000","assets/images/chicken-1.jpg","true","0"';
      var a = await load({ csv: csv });
      try {
        addBtns(a)[0].click(); a.w.KFCCart.open(); await wait(400);
        eq(a.w.__xss, undefined, 'script đã chạy');
        eq(a.d.querySelectorAll('img[src="x"]').length, 0, 'thẻ img độc hại đã được tạo');
        assert(a.d.querySelector('.cart-item__name').textContent === evil, 'tên giỏ phải là chữ nguyên văn');
        assert(a.d.querySelector('.product-card__title').textContent === evil, 'tên thẻ phải là chữ nguyên văn');
        eq(a.d.querySelectorAll('.product-card__description b').length, 0, 'mô tả không được render HTML');
      } finally { a.done(); }
    });

    // ---------- Runner ----------
    (async function run() {
      var list = document.getElementById('list');
      for (var i = 0; i < tests.length; i++) {
        var t = tests[i];
        var rec = { name: t.name, ok: true };
        try { await t.fn(); } catch (e) { rec.ok = false; rec.error = e && e.message ? e.message : String(e); }
        results.push(rec);
        var li = document.createElement('li');
        li.className = rec.ok ? 'pass' : 'fail';
        li.textContent = (rec.ok ? '✓ ' : '✗ ') + rec.name;
        if (!rec.ok) { var s = document.createElement('span'); s.className = 'err'; s.textContent = rec.error; li.appendChild(s); }
        list.appendChild(li);
      }
      localStorage.clear();
      var failed = results.filter(function (r) { return !r.ok; }).length;
      var summary = document.getElementById('summary');
      summary.textContent = (results.length - failed) + '/' + results.length + ' test passed' + (failed ? ' - ' + failed + ' FAILED' : '');
      summary.className = failed ? 'fail' : 'pass';
      window.__uiResults = results;
    })();
  })();
  </script>
